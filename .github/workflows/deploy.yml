name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel a run that is
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Fail here rather than after publishing if the export did not actually
      # produce the pages — a green deploy that serves a 404 is worse than a
      # red build.
      - name: Verify export
        run: |
          set -euo pipefail
          for f in out/en/index.html out/ar/index.html out/ku/index.html \
                   out/en/services/index.html out/index.html out/CNAME out/.nojekyll; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
          echo "export looks complete"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # NOT optional. From v4 this action defaults to
          # `--exclude=.[^/]*` when tarring, which drops every top-level
          # dotfile — including `.nojekyll`. Without `.nojekyll` GitHub Pages
          # runs Jekyll, Jekyll skips every directory starting with `_`, and
          # `_next/` disappears: the site returns 200 everywhere with no CSS
          # or JS. Neither `Verify export` (which reads `out/`, not the
          # artifact) nor a status-code smoke check would notice. v3 had no
          # such exclusion, which is why this line is new alongside the bump.
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Publishing an artifact and serving it at the right address are separate
      # things. The custom domain is a repo setting this workflow cannot see
      # (DEPLOY.md explains why), and when it is unset every step above still
      # passes while the live URL returns GitHub's "Site not found". Load the
      # real domain so that failure is red instead of green. This goes through
      # Cloudflare, so it checks the whole path a visitor takes, not just Pages.
      #
      # -L is load-bearing. `/` and the six legacy .html paths are 301s served
      # by Cloudflare Redirect Rules, so without it they report 301 and the job
      # fails on a perfectly healthy site. Following the chain also turns this
      # into the only test those rules have: they live in the Cloudflare
      # dashboard, not in this repo, so nothing else here would notice if one
      # were deleted or edited.
      #
      # `.nojekyll` is in the list for a different reason: it is the one file
      # whose absence breaks the site without changing any status code. If it
      # stops being published the site still answers 200 everywhere, just with
      # `_next/` stripped by Jekyll and no CSS or JS. Asking for it directly is
      # the cheapest way to prove it survived into the published artifact —
      # `Verify export` only proves it was in `out/` before upload.
      - name: Smoke-check the live site
        run: |
          set -euo pipefail
          failed=0
          for url in https://brightvolition.com/ \
                     https://brightvolition.com/en/ \
                     https://brightvolition.com/ar/ \
                     https://brightvolition.com/ku/ \
                     https://brightvolition.com/index.html \
                     https://brightvolition.com/about.html \
                     https://brightvolition.com/services.html \
                     https://brightvolition.com/products.html \
                     https://brightvolition.com/projects.html \
                     https://brightvolition.com/contact.html \
                     https://brightvolition.com/.nojekyll; do
            ok=0
            for attempt in 1 2 3 4 5; do
              code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "ok      $url"
                ok=1
                break
              fi
              echo "retry $attempt  $url -> $code"
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "FAILED  $url"
              failed=1
            fi
          done
          [ "$failed" = "0" ]
